[workspace]
resolver = "2"
members = [
    "crates/pocket-pi-agentos",
    "crates/pocket-pi-embedded",
    "crates/pocket-pi-protocols",
    "crates/pocket-pi-tools",
    "hosts/esp32-p4-sim",
    "tools/xtask",
]
# ESP-IDF owns its target, toolchain and lockfile. Keeping the firmware as a
# nested workspace lets the normal desktop CI remain fast and deterministic.
exclude = ["firmware/esp32-p4"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/pocket-stack/pocket-pi"

[workspace.dependencies]
anyhow = "1"
log = "0.4"
pocket-pi-protocols = { path = "crates/pocket-pi-protocols" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }

[workspace.dependencies.pocketjs-core]
git = "https://github.com/pocket-stack/pocketjs.git"
rev = "9c809bbd047ddc75c27caa4990951a78d942477a"

[workspace.dependencies.pocket-mod]
git = "https://github.com/pocket-stack/pocketjs.git"
rev = "9c809bbd047ddc75c27caa4990951a78d942477a"

[workspace.dependencies.pocket-ui-surface]
git = "https://github.com/pocket-stack/pocketjs.git"
rev = "9c809bbd047ddc75c27caa4990951a78d942477a"

[workspace.dependencies.pocket-db]
git = "https://github.com/pocket-stack/pocketjs.git"
rev = "9c809bbd047ddc75c27caa4990951a78d942477a"

[workspace.dependencies.pocket-fs]
git = "https://github.com/pocket-stack/pocketjs.git"
rev = "9c809bbd047ddc75c27caa4990951a78d942477a"

[workspace.dependencies.pocket-net]
git = "https://github.com/pocket-stack/pocketjs.git"
rev = "9c809bbd047ddc75c27caa4990951a78d942477a"

[profile.release]
opt-level = 2
