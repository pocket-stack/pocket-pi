[package]
name = "pocket-pi-embedded"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Small pi-agent-core runtime for embedded Pocket Pi hosts"

[dependencies]
log.workspace = true
pocket-mod.workspace = true
pocket-pi-protocols.workspace = true
# pocket-mod re-exports these types but does not enable target bindings.
# This direct edge unifies rquickjs features so ESP-IDF generates its bindings.
rquickjs = { version = "=0.12.1", default-features = false, features = ["bindgen", "std"] }
serde_json.workspace = true
