[package]
name = "pocket-pi-esp32-p4-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
env_logger = "0.11"
log.workspace = true
pocket-pi-agentos = { path = "../../crates/pocket-pi-agentos" }
pocket-pi-embedded = { path = "../../crates/pocket-pi-embedded" }
pocket-pi-protocols = { path = "../../crates/pocket-pi-protocols" }
pocket-pi-tools = { path = "../../crates/pocket-pi-tools" }
pocketjs-core.workspace = true
pocket-ui-wgpu = { git = "https://github.com/siwei-yuan/pocketjs.git", rev = "afc8d4e8e877dac7f9b0c01b5c0d667642009fc0" }
pocket3d = { git = "https://github.com/siwei-yuan/pocketjs.git", rev = "afc8d4e8e877dac7f9b0c01b5c0d667642009fc0", default-features = false }
serde_json.workspace = true
tempfile = "3"
ureq = { version = "2.12", features = ["json"] }
wgpu = "25"
winit = "0.30"
