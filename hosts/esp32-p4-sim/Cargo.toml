[package]
name = "pocket-pi-esp32-p4-sim"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
env_logger = "0.11"
log.workspace = true
pocket-pi-agentos = { path = "../../crates/pocket-pi-agentos" }
pocket-pi-embedded = { path = "../../crates/pocket-pi-embedded" }
pocket-pi-protocols = { path = "../../crates/pocket-pi-protocols" }
pocket-pi-tools = { path = "../../crates/pocket-pi-tools" }
pocketjs-core.workspace = true
pocket-ui-wgpu = { git = "https://github.com/pocket-stack/pocketjs.git", rev = "9c809bbd047ddc75c27caa4990951a78d942477a" }
pocket3d = { git = "https://github.com/pocket-stack/pocketjs.git", rev = "9c809bbd047ddc75c27caa4990951a78d942477a", default-features = false }
serde_json.workspace = true
tempfile = "3"
ureq = { version = "2.12", features = ["json"] }
wgpu = "25"
winit = "0.30"
