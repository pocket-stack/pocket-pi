<svg viewBox="0 0 760 590" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
  <title id="title">PocketPi system architecture</title>
  <desc id="description">Hardware sits beneath the native host, PocketJS runtime substrate and PocketPi JavaScript System Framework. The App layer contains a resident Pi Agent System Guest and bounded ordinary View and Action Guests. Durable App data sits outside every Guest.</desc>
  <rect width="760" height="590" rx="12" fill="#080c14"/>
  <text x="24" y="30" fill="#718198" font-size="12">PocketPi / one substrate / bounded Guests / durable Apps</text>

  <rect x="24" y="48" width="712" height="50" rx="7" fill="#0f1623" stroke="#53637a" stroke-width="1.5"/>
  <text x="380" y="78" fill="#e8eef7" font-size="13" font-weight="700" text-anchor="middle">Hardware</text>

  <rect x="24" y="112" width="712" height="88" rx="8" fill="#0f1623" stroke="#d49a36" stroke-width="1.5"/>
  <text x="380" y="139" fill="#e8eef7" font-size="13" font-weight="700" text-anchor="middle">Firmware / Native Host / Rust + C</text>
  <text x="380" y="163" fill="#8f9db0" font-size="11" text-anchor="middle">drivers / credentials / capability enforcement / storage roots / deadlines</text>
  <text x="380" y="181" fill="#64748b" font-size="10" text-anchor="middle">AppSupervisor / package validation / bounded Guest lifecycle / rendering</text>

  <rect x="24" y="214" width="712" height="64" rx="8" fill="#0f1623" stroke="#9f8bd8" stroke-width="1.5"/>
  <text x="380" y="241" fill="#e8eef7" font-size="13" font-weight="700" text-anchor="middle">PocketJS Runtime Platform / Rust + QuickJS C</text>
  <text x="380" y="262" fill="#8f9db0" font-size="11" text-anchor="middle">the device&apos;s only JavaScript execution substrate</text>

  <rect x="24" y="292" width="712" height="72" rx="8" fill="#0f1623" stroke="#5da8d1" stroke-width="1.5"/>
  <text x="380" y="319" fill="#e8eef7" font-size="13" font-weight="700" text-anchor="middle">PocketPi JS System Framework / SDK</text>
  <text x="380" y="341" fill="#8f9db0" font-size="11" text-anchor="middle">Actions / Projection / View components / navigation / App-facing APIs</text>
  <text x="380" y="357" fill="#64748b" font-size="10" text-anchor="middle">evaluated inside every Guest / not an App / not another Guest</text>

  <rect x="24" y="378" width="340" height="140" rx="8" fill="#0f1623" stroke="#d49a36" stroke-width="1.5"/>
  <text x="194" y="405" fill="#e8eef7" font-size="13" font-weight="700" text-anchor="middle">Pi Agent / System App</text>
  <text x="194" y="428" fill="#8f9db0" font-size="11" text-anchor="middle">1 resident System Guest</text>
  <line x1="54" y1="444" x2="334" y2="444" stroke="#263248"/>
  <text x="194" y="468" fill="#e8eef7" font-size="12" text-anchor="middle">Agent Core Harness Loop</text>
  <text x="194" y="492" fill="#8f9db0" font-size="11" text-anchor="middle">Chat / Files / Apps / Settings</text>
  <text x="194" y="509" fill="#64748b" font-size="10" text-anchor="middle">privileged / never in either LRU</text>

  <rect x="380" y="378" width="356" height="66" rx="8" fill="#0f1623" stroke="#65c3a0" stroke-width="1.5"/>
  <text x="558" y="400" fill="#e8eef7" font-size="12.5" font-weight="700" text-anchor="middle">Ordinary View Guests / LRU up to 3</text>
  <text x="558" y="419" fill="#8f9db0" font-size="10.5" text-anchor="middle">fixed View for the selected App release</text>
  <text x="558" y="436" fill="#64748b" font-size="8.5" text-anchor="middle">ADJUSTABLE BY HARDWARE PROFILE</text>

  <rect x="380" y="452" width="356" height="66" rx="8" fill="#0f1623" stroke="#65c3a0" stroke-width="1.5"/>
  <text x="558" y="474" fill="#e8eef7" font-size="12.5" font-weight="700" text-anchor="middle">Ordinary Action Guests / LRU up to 3</text>
  <text x="558" y="493" fill="#8f9db0" font-size="10.5" text-anchor="middle">Tool / UI / Schedule to the same Actions</text>
  <text x="558" y="510" fill="#64748b" font-size="8.5" text-anchor="middle">ADJUSTABLE BY HARDWARE PROFILE</text>

  <rect x="24" y="532" width="712" height="38" rx="7" fill="#0c1622" stroke="#65c3a0" stroke-width="1.5"/>
  <text x="380" y="556" fill="#e8eef7" font-size="12" text-anchor="middle">App-owned SQLite + files / durable across Guest eviction and restart</text>
</svg>
